services:
  - type: web
    name: wastewise
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: QR_TOKEN_EXPIRY_SECONDS
        value: 86400
