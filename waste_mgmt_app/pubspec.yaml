name: waste_mgmt_app
description: Community-Based Waste Management & Recycling Incentives Mobile App
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_messaging: ^15.1.3

  # Navigation
  go_router: ^14.3.0

  # State management
  provider: ^6.1.2

  # HTTP client
  http: ^1.2.2

  # Location & Maps
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Local storage
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # UI / Utils
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.8
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  # Using Material Icons — no custom fonts needed
